# Place inside the existing Nginx http context (e.g. sites-available).
server {
    listen 80;
    server_name _;
    root /var/www/cloudbridge/dist;
    index index.html;
    include /etc/nginx/mime.types;
    charset utf-8;
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
}
